[[permission]]
identifier = "allow-launcher"
description = "Local main launcher commands. Never grant this to remote game pages."
commands.allow = [
  "app_version", "creds_load", "creds_save", "window_control",
  "set_awake", "set_min_to_tray", "preset_read", "errlog_write", "errlog_open",
  "backup_save", "system_notify", "webhook_send", "userscript_fetch", "userscript_request",
  "account_clear", "proxy_apply", "autostart_get", "autostart_set",
  "blaster_start", "blaster_stop", "blaster_status", "blaster_send",
  "session_token_save", "session_token_get", "telemetry_report",
  "twitch_creds_load", "twitch_creds_save", "twitch_test", "twitch_sync_lives", "twitch_status_get",
  "kick_creds_load", "kick_creds_save", "kick_test", "kick_sync_lives", "kick_status_get",
  "kick_points_get", "kick_points_refresh", "kick_session_open", "kick_point_channels",
  "camoufox_check", "camoufox_login", "auth_cancel_login", "auth_window_open",
  "webview_settings", "webview_sync", "webview_set_visible", "webview_destroy", "webview_eval", "webview_navigate", "webview_fill_creds"
]
